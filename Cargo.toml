[workspace]
resolver = "2"
members = [
    "crates/tui-wire",
    "crates/tui-context",
    "crates/tui-provider",
    "crates/tui-session",
    "crates/tui-approval",
    "crates/tui-config",
    "crates/tui-memory",
    "crates/tui-computer",
    "crates/tui-tools",
    "crates/tui-mcp",
    "crates/tui-subagent",
    "crates/tui-katalog",
    "crates/tui-core",
    "crates/tui-sdk",
    "crates/tui-app",
    "gui",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
license = "MIT"
authors = ["iqbal"]

[workspace.dependencies]
tui-wire = { path = "crates/tui-wire" }
tui-context = { path = "crates/tui-context" }
tui-provider = { path = "crates/tui-provider" }
tui-session = { path = "crates/tui-session" }
tui-approval = { path = "crates/tui-approval" }
tui-config = { path = "crates/tui-config" }
tui-memory = { path = "crates/tui-memory" }
tui-computer = { path = "crates/tui-computer" }
tui-tools = { path = "crates/tui-tools" }
tui-mcp = { path = "crates/tui-mcp" }
tui-subagent = { path = "crates/tui-subagent" }
tui-katalog = { path = "crates/tui-katalog" }
tui-core = { path = "crates/tui-core" }
tui-sdk = { path = "crates/tui-sdk" }


base64 = "0.22"
bytes = "1"
async-trait = "0.1"
clap = { version = "4.5", features = ["derive"] }
crossterm = { version = "0.29", features = ["bracketed-paste"] }
directories = "6.0"
globset = "0.4"
futures-util = { version = "0.3", default-features = false }
ratatui = "0.30"
tokio-tungstenite = { version = "0.28", default-features = false, features = [
    "connect",
    "handshake",
    "rustls",
] }
unicode-width = "0.2"
regex = "1.11"
reqwest = { version = "0.12", default-features = false, features = [
    "rustls-tls",
    "stream",
    "json",
] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tokio = { version = "1.44", features = [
    "rt-multi-thread",
    "macros",
    "sync",
    "time",
    "process",
    "io-util",
    "io-std",
    "net",
    "signal",
    "test-util",
] }
toml = "0.8"
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
walkdir = "2.5"
rusqlite = { version = "0.41", features = ["bundled"] }
sha2 = "0.10"
enigo = "0.6"
image = { version = "0.25", default-features = false, features = ["png"] }
x11rb = { version = "0.13", features = ["randr"] }
arboard = "3.7"
lopdf = "0.47"
flate2 = "1"
qrcode = { version = "0.15", default-features = false, features = ["svg"] }

[workspace.lints.rust]
unsafe_code = "forbid"
dead_code = "deny"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"

[profile.release]
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"
