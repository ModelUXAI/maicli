name: Release-plz

# Alur rilis MANUAL via tag immutable:
#   1. bump versi + heading CHANGELOG, commit, push `main`;
#   2. buat tag `vX.Y.Z` lalu push tag — ini yang memicu `release.yml`
#      membangun biner + GUI dan mengunggahnya ke GitHub Release.
#
# Job `release-pr` sengaja tidak ada: repo melarang GitHub Actions membuat PR
# (403), dan release-plz memakai `GITHUB_TOKEN` secara default. Rilis tidak
# bergantung pada PR; tag manual sudah cukup dan tetap immutable.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-plz-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      tag: ${{ steps.deteksi.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: catat tag sebelum rilis
        shell: bash
        run: git tag --list 'v*' | sort -V > /tmp/tags-before

      - name: release-plz release
        uses: release-plz/action@v0.5
        with:
          command: release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: deteksi tag baru
        id: deteksi
        shell: bash
        run: |
          set -euo pipefail
          git fetch --tags --force
          git tag --list 'v*' | sort -V > /tmp/tags-after
          NEW=$(grep -Fxv -f /tmp/tags-before /tmp/tags-after | tail -1 || true)
          echo "tag=$NEW" >> "$GITHUB_OUTPUT"
          if [ -n "$NEW" ]; then
            echo "tag baru: $NEW"
          else
            echo "tidak ada tag baru (tidak ada perubahan rilis)"
          fi

  binaries:
    name: binaries
    needs: release
    if: needs.release.outputs.tag != ''
    permissions:
      contents: write
    uses: ./.github/workflows/release.yml
    with:
      tag: ${{ needs.release.outputs.tag }}
