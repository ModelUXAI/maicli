name: Release binaries

# Dipicu oleh:
#   1. tag `v*` (push manual / PAT),
#   2. `workflow_call` dari release-plz setelah tag dibuat (GITHUB_TOKEN tidak
#      memicu event `push` tag, jadi rilis otomatis memanggil workflow ini),
#   3. `workflow_dispatch` untuk rilis ulang manual.
#
# Artefak: Linux x64/arm64, macOS arm64/x64, Windows x64/arm64 + SHA256.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag rilis (vX.Y.Z)"
        required: true
        type: string
  workflow_call:
    inputs:
      tag:
        description: "Tag rilis (vX.Y.Z)"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  TAG: ${{ inputs.tag || github.ref_name }}
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: build (${{ matrix.arsip }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    env:
      APPLE_CERT_P12: ${{ secrets.APPLE_CERT_P12 }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-22.04
            arsip: maicli-linux-x64
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-22.04
            arsip: maicli-linux-arm64
          - target: aarch64-apple-darwin
            os: macos-latest
            arsip: maicli-macos-arm64
          - target: x86_64-apple-darwin
            os: macos-latest
            arsip: maicli-macos-x64
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            arsip: maicli-windows-x64
          - target: aarch64-pc-windows-msvc
            os: windows-latest
            arsip: maicli-windows-arm64
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref_name }}

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: release-${{ matrix.target }}

      # Tidak ada `cargo test` di sini: CI sudah menggating commit yang sama
      # sebelum tag dibuat. Menjalankan ulang test suite di saat rilis hanya
      # menambah flakiness (noise X11/clipboard pada runner) dan pernah
      # membatalkan artefak linux-x64.

      - name: deps lintas (linux arm64)
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        shell: bash
        run: |
          set -euo pipefail
          # Cukup toolchain link silang; `dpkg --add-architecture` + `apt-get
          # update` sering gagal/timeout di runner GitHub dan membatalkan rilis.
          sudo apt-get install -y gcc-aarch64-linux-gnu
          mkdir -p .cargo
          cat >> .cargo/config.toml <<'CFG'
          [target.aarch64-unknown-linux-gnu]
          linker = "aarch64-linux-gnu-gcc"
          CFG
      - name: build release
        run: cargo build --release --locked -p tui-app --target ${{ matrix.target }}

      - name: codesign (macOS, opsional)
        if: runner.os == 'macOS' && env.APPLE_CERT_P12 != ''
        env:
          APPLE_CERT_PASSWORD: ${{ secrets.APPLE_CERT_PASSWORD }}
          APPLE_SIGN_IDENTITY: ${{ secrets.APPLE_SIGN_IDENTITY }}
        shell: bash
        run: |
          set -euo pipefail
          KEYCHAIN="$RUNNER_TEMP/maicli-sign.keychain-db"
          echo "$APPLE_CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$APPLE_CERT_PASSWORD" "$KEYCHAIN"
          security unlock-keychain -p "$APPLE_CERT_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" -P "$APPLE_CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -k "$APPLE_CERT_PASSWORD" "$KEYCHAIN" >/dev/null
          codesign --force --options runtime --timestamp --sign "$APPLE_SIGN_IDENTITY" \
            "target/${{ matrix.target }}/release/maicli"
          codesign --verify --strict --verbose=2 "target/${{ matrix.target }}/release/maicli"

      - name: notarize (macOS, opsional)
        if: runner.os == 'macOS' && env.APPLE_CERT_P12 != ''
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          BIN="target/${{ matrix.target }}/release/maicli"
          ZIP="$RUNNER_TEMP/maicli-notarize.zip"
          ditto -c -k --keepParent "$BIN" "$ZIP"
          xcrun notarytool submit "$ZIP" \
            --apple-id "$APPLE_ID" \
            --team-id "$APPLE_TEAM_ID" \
            --password "$APPLE_APP_PASSWORD" \
            --wait
          xcrun stapler staple "$BIN"

      - name: paket (unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          DIR="dist/${{ matrix.arsip }}"
          mkdir -p "$DIR"
          cp "target/${{ matrix.target }}/release/maicli" "$DIR/"
          cp LICENSE README.md CHANGELOG.md "$DIR/"
          # `strip` host hanya bisa membaca ELF arsitektur host; untuk arm64
          # pakai `aarch64-linux-gnu-strip` yang dipasang di langkah deps lintas.
          if [ "${{ runner.os }}" != "macOS" ]; then
            if [ "${{ matrix.target }}" = "aarch64-unknown-linux-gnu" ]; then
              aarch64-linux-gnu-strip "$DIR/maicli"
            else
              strip "$DIR/maicli"
            fi
          fi
          tar -czf "dist/${{ matrix.arsip }}-${TAG}.tar.gz" -C dist "${{ matrix.arsip }}"
          rm -rf "$DIR"
          (cd dist && sha256sum "${{ matrix.arsip }}-${TAG}.tar.gz" > "${{ matrix.arsip }}-${TAG}.tar.gz.sha256")

      - name: paket (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $dir = "dist/${{ matrix.arsip }}"
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/maicli.exe" $dir
          Copy-Item LICENSE, README.md, CHANGELOG.md $dir
          $zip = "dist/${{ matrix.arsip }}-$env:TAG.zip"
          Compress-Archive -Path "$dir/*" -DestinationPath $zip
          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLower()
          "$hash  ${{ matrix.arsip }}-$env:TAG.zip" |
            Out-File -Encoding ascii "dist/${{ matrix.arsip }}-$env:TAG.zip.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.arsip }}
          path: dist/*
          if-no-files-found: error


  gui:
    name: gui (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            arsip: maicli-gui-linux
            target: x86_64-unknown-linux-gnu
          - os: windows-latest
            arsip: maicli-gui-windows
            target: x86_64-pc-windows-msvc
          - os: macos-latest
            arsip: maicli-gui-macos
            target: x86_64-apple-darwin
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref_name }}

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # 1) Bangun core CLI yang akan dibundel Electron.
      - name: bangun core maicli
        run: cargo build --release --locked -p tui-app --target ${{ matrix.target }}

      # 2) Bangun frontend TypeScript → desktop/frontend-dist.
      - name: pasang dependensi frontend
        working-directory: frontend
        run: npm ci
      - name: bangun frontend
        working-directory: frontend
        run: npm run build
      - name: salin frontend ke host Electron
        shell: bash
        run: |
          set -euo pipefail
          rm -rf desktop/frontend-dist
          mkdir -p desktop/frontend-dist
          cp -R frontend/dist/. desktop/frontend-dist/

      # 3) Letakkan biner core di desktop/bin, lalu kemas dengan electron-builder.
      - name: siapkan biner core
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p desktop/bin
          if [ "$RUNNER_OS" = "Windows" ]; then
            cp "target/${{ matrix.target }}/release/maicli.exe" desktop/bin/maicli.exe
          else
            cp "target/${{ matrix.target }}/release/maicli" desktop/bin/maicli
          fi

      - name: pasang dependensi Electron
        working-directory: desktop
        shell: bash
        # `npm ci` melewati postinstall electron-winstaller pada runner Windows
        # (pemilihan arsitektur 7z), yang dibutuhkan electron-builder.
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then npm install; else npm ci; fi
      - name: bangun installer Electron
        working-directory: desktop
        run: npm run dist

      - name: kumpulkan artefak GUI
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist-gui
          find desktop/release -maxdepth 1 -type f \
            \( -name '*.exe' -o -name '*.msi' -o -name '*.deb' -o -name '*.AppImage' -o -name '*.dmg' -o -name '*.zip' \) \
            -exec cp {} dist-gui/ \;
          ls -la dist-gui
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.arsip }}
          path: dist-gui/*
          if-no-files-found: warn

  release:
    name: release
    needs: [build, gui]
    # GitHub bisa membatalkan job macOS karena batas runner akun. Tetap rilis
    # artefak target yang berhasil (minimal satu) daripada melewati rilis
    # seluruhnya; `if-no-files-found: error` di upload menjamin tiap job sukses
    # hanya bila benar-benar menghasilkan arsip.
    if: always() && needs.build.result != 'skipped'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref_name }}

      - name: verifikasi tag = versi Cargo.toml
        shell: bash
        run: |
          set -euo pipefail
          VER="${TAG#v}"
          CARGO_VER=$(awk '/^\[workspace.package\]/{f=1;next} f&&/^version/{gsub(/"/,"",$3);print $3;exit}' Cargo.toml)
          if [ "$VER" != "$CARGO_VER" ]; then
            echo "tag $TAG tidak cocok dengan [workspace.package] version $CARGO_VER" >&2
            exit 1
          fi

      - name: catatan changelog
        id: catatan
        shell: bash
        run: |
          set -euo pipefail
          VER="${TAG#v}"
          TEKS=$(awk -v ver="## [$VER]" 'index($0,ver)==1{flag=1;next} /^## \[/{flag=0} flag' CHANGELOG.md)
          if [ -z "$TEKS" ]; then TEKS="Rilis $TAG"; fi
          { echo "teks<<EOF"; echo "$TEKS"; echo "EOF"; } >> "$GITHUB_OUTPUT"

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: buat/perbarui GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          name: ${{ env.TAG }}
          body: ${{ steps.catatan.outputs.teks }}
          files: dist/*
          fail_on_unmatched_files: true
          generate_release_notes: false
          prerelease: ${{ contains(env.TAG, '-') }}
