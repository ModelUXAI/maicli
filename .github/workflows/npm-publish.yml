name: npm publish (maicli)

# Opsional — bukan bagian dari gerbang rilis GitHub. Jalankan manual setelah
# GitHub Release berisi artefak platform. Butuh secret NPM_TOKEN (scope publish).
#
#   modeluxai-linux-x64, modeluxai-linux-arm64,
#   modeluxai-win32-x64, modeluxai-win32-arm64
# (biner macOS belum tersedia karena batas runner GitHub Actions akun;
#  wrapper akan memberi pesan jelas bila platform tidak didukung.)
# Instal: `npm install -g @modeluxai/cli`

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag rilis yang sudah punya artefak platform (vX.Y.Z)"
        required: true
        type: string

permissions:
  contents: read

env:
  NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
  TAG: ${{ inputs.tag }}

jobs:
  npm-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org/

      - name: unduh artefak dari GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p dist
          gh release download "$TAG" \
            -p "maicli-linux-x64-$TAG.tar.gz" \
            -p "maicli-linux-arm64-$TAG.tar.gz" \
            -p "maicli-windows-x64-$TAG.zip" \
            -p "maicli-windows-arm64-$TAG.zip" \
            -D dist
          ls -la dist/

      - name: ekstrak ke pohon paket platform
        run: |
          set -euo pipefail
          mkdir -p pkg/linux-x64 pkg/linux-arm64 pkg/win32-x64 pkg/win32-arm64
          tar -xzf "dist/maicli-linux-x64-$TAG.tar.gz" -C pkg/linux-x64 --strip-components=1
          tar -xzf "dist/maicli-linux-arm64-$TAG.tar.gz" -C pkg/linux-arm64 --strip-components=1
          unzip -o "dist/maicli-windows-x64-$TAG.zip" -d pkg/win32-x64
          unzip -o "dist/maicli-windows-arm64-$TAG.zip" -d pkg/win32-arm64
          find pkg -maxdepth 2 -type f | sort

      - name: tulis package.json platform
        run: |
          set -euo pipefail
          VER="${TAG#v}"
          tulis() {
            local key="$1" os="$2" cpu="$3"
            cat > "pkg/$key/package.json" <<EOF
          {
            "name": "modeluxai-$key",
            "version": "$VER",
            "description": "Biner maicli (ModeluXAI) untuk $key",
            "license": "MIT",
            "os": ["$os"],
            "cpu": ["$cpu"],
            "files": ["maicli*"]
          }
          tulis linux-x64 linux x64
          tulis linux-arm64 linux arm64
          tulis win32-x64 win32 x64
          tulis win32-arm64 win32 arm64

      - name: sinkronkan versi wrapper
        run: |
          set -euo pipefail
          node -e '
            const fs = require("fs");
            const p = "npm/modeluxai/package.json";
            const j = JSON.parse(fs.readFileSync(p, "utf8"));
            const ver = process.env.TAG.replace(/^v/, "");
            j.version = ver;
            j.optionalDependencies = {
              "modeluxai-linux-x64": ver,
              "modeluxai-linux-arm64": ver,
              "modeluxai-win32-x64": ver,
              "modeluxai-win32-arm64": ver
            };
            fs.writeFileSync(p, JSON.stringify(j, null, 2) + "\n");
          '

      - name: publish paket platform
        if: env.NPM_TOKEN != ''
        env:
          NODE_AUTH_TOKEN: ${{ env.NPM_TOKEN }}
        run: |
          set -euo pipefail
          for dir in pkg/*/; do
            [ -f "$dir/package.json" ] || continue
            (cd "$dir" && npm publish --access public --no-git-checks)
          done

      - name: publish wrapper + dist-tag
        if: env.NPM_TOKEN != ''
        env:
          NODE_AUTH_TOKEN: ${{ env.NPM_TOKEN }}
        run: |
          set -euo pipefail
          cd npm/modeluxai
          npm publish --access public --no-git-checks
          npm dist-tag add "@modeluxai/cli@${TAG#v}" maicli
